services:
  game:
    profiles: [combined]
    build: .
    ports: ["${DEMO_PORT:-8080}:8080"]
    restart: unless-stopped
  server:
    profiles: [split]
    build: .
    environment:
      SERVE_UI: "false"
      PORT: "8080"
    restart: unless-stopped
  ui:
    profiles: [split]
    build: .
    environment:
      INTERNAL_API_URL: "http://server:8080"
    ports: ["${DEMO_PORT:-8080}:8080"]
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
